<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Game Screen</title>
<style>
@font-face { font-family: 'Londrina'; src: url('assets/fonts/LondrinaSolid-Regular.ttf'); font-weight: 400; }
@font-face { font-family: 'Londrina'; src: url('assets/fonts/LondrinaSolid-Black.ttf'); font-weight: 900; }
:root {
  --gold: #FFC216; --blue: #2AAAE2; --navy: #0b4f7a; --ink: #1a1512; --cream: #FFF4D6;
  --purple: #733C80; --orange: #F09C53; --red: #E5352B; --drop: rgba(6, 34, 52, .6);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; }
#stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: center;
  font-family: 'Londrina', 'Arial Black', sans-serif; color: var(--ink); overflow: hidden; background: var(--blue); }

/* Tie-dye spiral, painted once by display.js */
#dye { position: absolute; z-index: 0; left: 50%; top: 50%; width: 2400px; height: 2400px; margin: -1200px; animation: spin 320s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Marquee rails */
.bulbs { position: absolute; z-index: 5; left: 0; right: 0; height: 44px; display: flex; justify-content: space-around; align-items: center; padding: 0 14px; background: var(--ink); }
.bulbs.top { top: 0; border-bottom: 6px solid var(--gold); } .bulbs.bot { bottom: 0; border-top: 6px solid var(--gold); }
.bulbs i { width: 20px; height: 20px; border-radius: 50%; background: #6b5413; animation: bulb .8s steps(1) infinite; }
@keyframes bulb { 0% { background: #fff8d8; } 25% { background: #6b5413; } }

.screen { position: absolute; inset: 44px 0; z-index: 1; isolation: isolate; opacity: 0; visibility: hidden; transition: opacity .3s, visibility .3s; }
.screen.on { opacity: 1; visibility: visible; }
.center { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }

/* Shared hand-inked look: flat colour, thick outline, hard shadow */
.ink { -webkit-text-stroke: 16px var(--ink); paint-order: stroke fill; text-shadow: 10px 12px 0 var(--ink); }
.ribbon { display: inline-block; background: var(--ink); color: #fff; padding: 6px 34px 10px; border-radius: 10px; }

/* Title */
.logos { display: flex; align-items: center; gap: 50px; margin-bottom: 26px; }
.logo-card { width: 290px; height: 290px; background: #fff; border-radius: 50%; overflow: hidden; border: 9px solid var(--ink); box-shadow: 10px 12px 0 var(--drop); transform: rotate(-5deg); }
.logo-card.c { transform: rotate(5deg); }
.logo-card img { width: 100%; height: 100%; object-fit: contain; transform: scale(1.75); }
.logo-card:not(.c) img { transform: scale(2.15); }
.vs { font-weight: 900; font-size: 120px; color: #fff; }
.mega { font-weight: 900; font-size: 196px; line-height: .98; color: var(--gold); letter-spacing: 4px; transform: rotate(-2deg); }
.sub { font-size: 56px; margin-top: 34px; transform: rotate(-2deg); }
.tag { font-size: 40px; margin-top: 18px; background: var(--gold); color: var(--ink); border: 6px solid var(--ink); border-radius: 10px; padding: 2px 28px 6px; transform: rotate(1deg); }

/* Teams intro */
.rosters { display: flex; gap: 110px; }
.roster { width: 660px; border-radius: 26px; background: var(--cream); border: 9px solid var(--ink); box-shadow: 14px 16px 0 var(--drop); overflow: hidden; transform: rotate(-1.5deg); }
.roster.t1 { transform: rotate(1.5deg); }
.roster h2 { font-weight: 900; font-size: 92px; line-height: 1; padding: 18px 20px 24px; background: var(--gold); border-bottom: 9px solid var(--ink); }
.roster.t1 h2 { background: var(--purple); color: #fff; }
.roster ul { padding: 18px 0 24px; }
.roster li { list-style: none; font-size: 60px; padding: 4px 0; }

/* Rules */
#ru-title { font-weight: 900; font-size: 108px; color: var(--gold); line-height: 1; margin: 6px 0 22px; transform: rotate(-1.5deg); }
#ru-list { width: 1640px; display: flex; flex-direction: column; gap: 16px; }
.rule { display: flex; align-items: center; height: 112px; background: var(--cream); border: 7px solid var(--ink); border-radius: 16px; box-shadow: 8px 9px 0 var(--drop);
  text-align: left; opacity: 0; scale: .6; translate: -120px 0; transition: opacity .25s, scale .4s cubic-bezier(.2,1.7,.4,1), translate .4s cubic-bezier(.2,1.4,.4,1); overflow: hidden; }
.rule.show { opacity: 1; scale: 1; translate: 0 0; }
.rule:nth-child(even) { rotate: .6deg; } .rule:nth-child(odd) { rotate: -.6deg; }
.rule b { width: 112px; align-self: stretch; display: flex; align-items: center; justify-content: center; background: var(--gold); border-right: 7px solid var(--ink); font-weight: 900; font-size: 72px; padding-bottom: 8px; flex: none; }
.rule span { font-size: 45px; line-height: 1.02; padding: 0 24px 6px; }
#ru-list.tight { gap: 12px; }
#ru-list.tight .rule { height: 100px; }
#ru-list.tight .rule b { width: 100px; font-size: 62px; }
#ru-list.tight .rule span { font-size: 43px; }

/* Closing */
#o-title { font-weight: 900; font-size: 170px; color: var(--gold); line-height: 1; transform: rotate(-2deg); }
#o-champ { font-size: 76px; margin-top: 44px; transform: rotate(-2deg); }
#o-result { font-size: 50px; margin-top: 22px; background: var(--gold); color: var(--ink); border: 6px solid var(--ink); border-radius: 10px; padding: 2px 28px 6px; transform: rotate(1deg); }
#o-result:empty { display: none; }
#o-line { font-size: 48px; margin-top: 30px; background: var(--cream); border: 6px solid var(--ink); border-radius: 10px; padding: 2px 28px 6px; }
#s-outro > *:not(.rays) { position: relative; }
#s-outro.enter #o-title { animation: zoom .6s cubic-bezier(.2,1.7,.4,1) both; }

/* Round card */
.burst { position: absolute; left: 50%; top: 50%; width: 1060px; height: 1060px; margin: -530px; background: var(--ink); animation: spin 50s linear infinite; }
.burst.in { width: 1000px; height: 1000px; margin: -500px; background: var(--gold); }
#rc-label { position: relative; font-weight: 900; font-size: 250px; color: #fff; line-height: 1; transform: rotate(-3deg); }
#rc-mult { position: relative; font-weight: 900; font-size: 96px; margin-top: 30px; transform: rotate(-3deg); }
#rc-mult:empty { display: none; }

/* Board */
#potwrap { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); text-align: center; }
#roundlabel { position: relative; z-index: 1; display: inline-block; font-size: 34px; letter-spacing: 2px; background: var(--gold); border: 5px solid var(--ink); border-radius: 8px; padding: 0 20px 3px; transform: rotate(-3deg) translate(-150px, 14px); }
#pot { font-weight: 900; font-size: 96px; line-height: 1; min-width: 340px; padding: 2px 40px 10px; color: var(--gold);
  background: var(--ink); border: 8px solid #fff; border-radius: 22px; box-shadow: 10px 12px 0 var(--drop); }
#question { position: absolute; left: 330px; right: 330px; top: 196px; height: 84px; display: flex; align-items: center; justify-content: center; text-align: center;
  font-size: 42px; line-height: 1.02; background: var(--cream); border: 6px solid var(--ink); border-radius: 14px; padding: 0 24px 4px;
  opacity: 0; transform: translateY(-20px); transition: opacity .3s, transform .3s; }
#question.on { opacity: 1; transform: none; }
#boardframe { position: absolute; left: 292px; top: 296px; width: 1336px; height: 560px; background: var(--ink); border: 8px solid #fff; border-radius: 30px; box-shadow: 14px 16px 0 var(--drop); }
#grid { position: absolute; left: 318px; top: 322px; width: 1284px; height: 508px;
  display: grid; grid-auto-flow: column; grid-template-rows: repeat(4, 1fr); grid-template-columns: 1fr 1fr; gap: 14px; }
.tile { perspective: 1400px; }
.inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.3,1.5,.5,1); }
.tile.rev .inner { transform: rotateX(180deg); }
.front, .back { position: absolute; inset: 0; border-radius: 14px; backface-visibility: hidden; display: flex; align-items: center; overflow: hidden; }
.front { justify-content: center; background: var(--blue); box-shadow: inset 0 -12px 0 rgba(0,0,0,.2), inset 0 8px 0 rgba(255,255,255,.28); }
.tile.empty .front { background: #2b3a44; box-shadow: inset 0 -12px 0 rgba(0,0,0,.2); }
.num { width: 120px; height: 84px; border-radius: 50%; background: var(--gold); color: var(--ink); font-weight: 900; font-size: 64px;
  display: flex; align-items: center; justify-content: center; border: 6px solid var(--ink); padding-bottom: 6px; }
.back { transform: rotateX(180deg); background: var(--cream); padding-left: 26px; box-shadow: inset 0 -10px 0 rgba(0,0,0,.12); }
.atext { flex: 1; font-size: 60px; text-transform: uppercase; white-space: nowrap; overflow: hidden; padding-bottom: 6px; }
.atext.m { font-size: 46px; } .atext.s { font-size: 36px; }
.apts { width: 132px; height: 100%; background: var(--gold); border-left: 6px solid var(--ink); font-weight: 900; font-size: 72px; display: flex; align-items: center; justify-content: center; padding-bottom: 8px; }

.team { position: absolute; top: 296px; width: 244px; height: 560px; border-radius: 26px; background: var(--gold);
  border: 8px solid var(--ink); box-shadow: 10px 12px 0 var(--drop); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  transition: transform .3s cubic-bezier(.3,1.6,.5,1); padding: 12px; }
.team.t0 { left: 24px; } .team.t1 { right: 24px; background: var(--purple); color: #fff; }
.tname { font-weight: 900; font-size: 52px; line-height: 1; word-break: break-word; }
.t1 .tname { color: var(--orange); }
.tscore { font-weight: 900; font-size: 112px; line-height: 1; margin-top: 26px; width: 100%; background: var(--ink); color: #fff; border-radius: 14px; padding: 6px 0 16px; }
.tstatus { font-size: 34px; margin-top: 24px; letter-spacing: 2px; background: #fff; color: var(--ink); border: 5px solid var(--ink); border-radius: 8px; padding: 0 14px 3px; transform: rotate(-4deg); }
.tstatus:empty { visibility: hidden; }
.team.active { transform: translateY(-20px) rotate(-2.5deg) scale(1.05); outline: 8px solid #fff; }
.team.t1.active { transform: translateY(-20px) rotate(2.5deg) scale(1.05); }
.team.buzzed { animation: flash .3s steps(1) 5; }
@keyframes flash { 50% { background: #fff; } }

#strikes { position: absolute; left: 50%; top: 872px; transform: translateX(-50%); display: flex; gap: 22px; opacity: 0; transition: opacity .3s; }
#strikes.on { opacity: 1; }
.sx { width: 104px; height: 104px; border-radius: 16px; border: 6px solid var(--ink); background: var(--cream);
  display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 92px; color: transparent; line-height: 1; padding-bottom: 8px; }
.sx.hit { background: var(--red); color: #fff; transform: rotate(-5deg); }
.sx.hit:nth-child(2) { transform: rotate(4deg); }

#xoverlay { position: absolute; z-index: 30; transform: translateZ(0); inset: 0; display: none; align-items: center; justify-content: center; gap: 46px; background: rgba(11, 79, 122, .55); }
#xoverlay.on { display: flex; }
.bigx { width: 420px; height: 420px; border-radius: 50px; border: 18px solid var(--ink); background: var(--red); color: #fff;
  font-weight: 900; font-size: 420px; line-height: 1; display: flex; align-items: center; justify-content: center; padding-bottom: 40px;
  box-shadow: 18px 20px 0 var(--ink); animation: pop .3s cubic-bezier(.2,1.9,.4,1) both; transform: rotate(-4deg); }
.bigx:nth-child(2) { transform: rotate(3deg); animation-delay: .08s; }
.bigx:nth-child(3) { transform: rotate(-2deg); animation-delay: .16s; }
.bigmsg { font-weight: 900; font-size: 220px; color: #fff; background: var(--red); border: 18px solid var(--ink); border-radius: 40px; padding: 0 60px 24px;
  box-shadow: 18px 20px 0 var(--ink); transform: rotate(-4deg); animation: pop .3s cubic-bezier(.2,1.9,.4,1) both; }
@keyframes pop { from { scale: .2; opacity: 0; } }

#banner { position: absolute; z-index: 20; left: -60px; right: -60px; top: 850px; height: 160px; display: none; align-items: center; justify-content: center;
  font-weight: 900; font-size: 108px; background: var(--gold); border-top: 10px solid var(--ink); border-bottom: 10px solid var(--ink);
  white-space: nowrap; padding-bottom: 10px; rotate: -2deg; box-shadow: 0 16px 0 var(--drop); }
#banner.on { display: flex; }
#banner.t1 { background: var(--purple); color: #fff; }
#banner.go { animation: slide 2.6s cubic-bezier(.2,1,.3,1) both; }
@keyframes slide { 0% { transform: translateX(-110%); } 12% { transform: none; } 88% { transform: none; } 100% { transform: translateX(110%); } }

#stage.shake { animation: shake .45s; }
@keyframes shake { 15% { margin-left: -24px; margin-top: 8px; } 30% { margin-left: 20px; margin-top: -6px; } 45% { margin-left: -14px; } 60% { margin-left: 10px; margin-top: 4px; } 80% { margin-left: -5px; } }
.tile.pop { animation: tpop .7s; z-index: 2; }
@keyframes tpop { 35% { transform: scale(1.09) rotate(-1.5deg); } }
.bump { animation: bump .5s; }
@keyframes bump { 40% { transform: scale(1.18) rotate(-3deg); } }
#s-roundcard.enter #rc-label, #s-winner.enter #w-name, #s-break.enter .mega { animation: zoom .6s cubic-bezier(.2,1.7,.4,1) both; }
#s-roundcard.enter #rc-mult { animation: zoom .6s .3s cubic-bezier(.2,1.7,.4,1) both; }
#s-roundcard.enter #rc-face { animation: zoom .6s .6s cubic-bezier(.2,1.7,.4,1) both; }
#s-title.enter .logo-card { animation: slam .5s cubic-bezier(.3,1.4,.5,1) both; }
#s-title.enter .logo-card.c { animation-delay: .18s; }
#s-title.enter .vs { animation: zoom .4s .36s cubic-bezier(.2,1.9,.4,1) both; }
.mega .w { display: inline-block; white-space: nowrap; }
#s-title.enter .mega .w { animation: drop .55s cubic-bezier(.2,1.5,.4,1) both; }
#s-title.enter .sub { animation: rise .45s 1.1s cubic-bezier(.2,1.5,.4,1) both; }
#s-title.enter .tag { animation: rise .45s 1.3s cubic-bezier(.2,1.5,.4,1) both; }
@keyframes slam { from { scale: 3.5; opacity: 0; } }
@keyframes drop { from { translate: 0 -760px; rotate: -14deg; } }
@keyframes rise { from { translate: 0 90px; opacity: 0; } }

.float { position: absolute; z-index: 5; font-weight: 900; font-size: 116px; line-height: 1; color: #fff; -webkit-text-stroke: 14px var(--ink); paint-order: stroke fill;
  animation: floatup 1.3s cubic-bezier(.2,1,.4,1) both; pointer-events: none; }
@keyframes floatup { 0% { scale: .3; opacity: 0; } 18% { scale: 1.25; opacity: 1; rotate: -6deg; } 70% { opacity: 1; } 100% { translate: 0 -170px; opacity: 0; } }
.fly { position: absolute; left: 960px; top: 96px; z-index: 6; font-weight: 900; font-size: 140px; line-height: 1; color: var(--gold); -webkit-text-stroke: 16px var(--ink); paint-order: stroke fill; }
.confb { position: absolute; top: 560px; z-index: 25; width: 22px; height: 32px; border: 3px solid var(--ink); }

.tlogo { position: absolute; top: -96px; left: 50%; margin-left: -76px; width: 152px; height: 152px; border-radius: 50%; background: #fff; border: 8px solid var(--ink); overflow: hidden; box-shadow: 6px 7px 0 var(--drop); }
.tlogo img { width: 100%; height: 100%; object-fit: contain; transform: scale(1.75); }
.t0 .tlogo img { transform: scale(2.15); }
.crown { position: absolute; top: -168px; left: 50%; margin-left: -20px; width: 120px; height: 78px; rotate: 16deg; scale: 0; transition: scale .45s cubic-bezier(.2,1.9,.4,1);
  filter: drop-shadow(5px 0 0 var(--ink)) drop-shadow(-5px 0 0 var(--ink)) drop-shadow(0 5px 0 var(--ink)) drop-shadow(0 -5px 0 var(--ink)); }
.crown i { display: block; width: 100%; height: 100%; background: var(--gold); clip-path: polygon(0 100%, 0 12%, 26% 55%, 50% 0, 74% 55%, 100% 12%, 100% 100%); }
.team.lead .crown { scale: 1; }
.t1 .crown i { background: var(--orange); }
#rc-face { position: relative; font-size: 60px; margin-top: 30px; background: var(--cream); border: 7px solid var(--ink); border-radius: 12px; padding: 0 30px 6px; transform: rotate(-3deg); max-width: 900px; }
#rc-face:empty { display: none; }
#fm-tnum { width: 124px; height: 124px; border-radius: 50%; background: var(--cream); border: 7px solid var(--ink); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 84px; padding-bottom: 8px; }
#bk-title { margin-top: 40px; }
#s-teams.enter .roster.t0 { animation: inL .55s cubic-bezier(.2,1.3,.4,1) both; }
#s-teams.enter .roster.t1 { animation: inR .55s cubic-bezier(.2,1.3,.4,1) both; }
#s-board.enter #grid .tile { animation: zoom .45s cubic-bezier(.2,1.5,.4,1) both; }
@keyframes zoom { from { scale: .3; opacity: 0; } }
@keyframes inL { from { translate: -1000px 0; } }
@keyframes inR { from { translate: 1000px 0; } }

/* Lightning round */
#fm-title { position: absolute; top: 4px; width: 100%; text-align: center; font-weight: 900; font-size: 116px; color: var(--gold); transform: rotate(-1.5deg); }
#fm-cols { position: absolute; top: 176px; left: 150px; right: 150px; display: flex; gap: 70px; }
.fmcol { flex: 1; display: flex; flex-direction: column; gap: 14px; }
.fmrow { display: flex; height: 100px; border: 7px solid var(--ink); border-radius: 14px; overflow: hidden; background: var(--cream); box-shadow: 8px 9px 0 var(--drop); }
.fmtext { flex: 1; display: flex; align-items: center; padding: 0 0 6px 24px; font-size: 54px; text-transform: uppercase; white-space: nowrap; overflow: hidden; }
.fmpts { width: 140px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 68px; background: var(--ink); color: var(--gold); padding-bottom: 8px; }
#fm-bottom { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: center; align-items: center; gap: 70px; }
#fm-timer { width: 180px; height: 180px; border-radius: 50%; border: 9px solid var(--ink); background: var(--gold); display: flex; align-items: center; justify-content: center; box-shadow: 8px 9px 0 var(--drop); }
#fm-timer.low { animation: bump .5s infinite; }
#fm-total { font-weight: 900; font-size: 100px; background: var(--ink); color: #fff; border: 8px solid #fff; border-radius: 20px; padding: 0 44px 12px; box-shadow: 10px 12px 0 var(--drop); }
#fm-total b { color: var(--gold); }
#fm-total.won { animation: wig .5s ease-in-out infinite alternate; }
@keyframes wig { from { transform: rotate(-3deg) scale(1.04); } to { transform: rotate(3deg) scale(1.1); } }

/* Winner */
.rays { position: absolute; left: 50%; top: 50%; width: 2800px; height: 2800px; margin: -1400px;
  background: repeating-conic-gradient(rgba(255,255,255,.34) 0 9deg, transparent 9deg 18deg); animation: spin 60s linear infinite; }
#s-winner > *:not(.rays):not(#confetti) { position: relative; }
#w-name { font-weight: 900; font-size: 230px; line-height: 1; margin-top: 30px; transform: rotate(-3deg); }
#w-score { font-weight: 900; font-size: 110px; margin-top: 50px; transform: rotate(-3deg); }
#confetti { position: absolute; inset: 0; }
.conf { position: absolute; top: -60px; width: 24px; height: 36px; border: 3px solid var(--ink); animation: fall linear infinite; }
@keyframes fall { to { transform: translateY(1200px) rotate(720deg); } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="dye"></canvas>

  <section id="s-title" class="screen center">
    <div class="logos">
      <div class="logo-card"><img src="assets/tdi-logo.png" alt=""></div>
      <div class="vs ink">VS</div>
      <div class="logo-card c"><img src="assets/crabs-logo.png" alt=""></div>
    </div>
    <div class="mega ink" id="t-title"></div>
    <div class="sub ribbon" id="t-sub"></div>
    <div class="tag" id="t-tag"></div>
  </section>

  <section id="s-teams" class="screen center">
    <div class="rosters">
      <div class="roster t0"><h2 id="ro-n0"></h2><ul id="ro-p0"></ul></div>
      <div class="roster t1"><h2 id="ro-n1"></h2><ul id="ro-p1"></ul></div>
    </div>
  </section>

  <section id="s-rules" class="screen center">
    <div id="ru-title" class="ink"></div>
    <div id="ru-list"></div>
  </section>

  <section id="s-outro" class="screen center">
    <div class="rays"></div>
    <div id="o-title" class="ink"></div>
    <div id="o-champ" class="ribbon"></div>
    <div id="o-result"></div>
    <div id="o-line"></div>
  </section>

  <section id="s-break" class="screen center">
    <div class="mega ink">BE RIGHT BACK</div>
    <div class="sub ribbon" id="bk-title"></div>
  </section>

  <section id="s-roundcard" class="screen center">
    <div class="burst star"></div><div class="burst in star"></div>
    <div id="rc-label" class="ink"></div><div id="rc-mult" class="ribbon"></div><div id="rc-face"></div>
  </section>

  <section id="s-board" class="screen">
    <div id="potwrap"><div id="roundlabel"></div><div id="pot">0</div></div>
    <div id="question"></div>
    <div class="team t0" id="team0"><div class="crown"><i></i></div><div class="tlogo"><img src="assets/tdi-logo.png" alt=""></div><div class="tname"></div><div class="tscore">0</div><div class="tstatus"></div></div>
    <div class="team t1" id="team1"><div class="crown"><i></i></div><div class="tlogo"><img src="assets/crabs-logo.png" alt=""></div><div class="tname"></div><div class="tscore">0</div><div class="tstatus"></div></div>
    <div id="boardframe"></div>
    <div id="grid"></div>
    <div id="strikes"><div class="sx">X</div><div class="sx">X</div><div class="sx">X</div></div>
  </section>

  <section id="s-fm" class="screen">
    <div id="fm-title" class="ink"></div>
    <div id="fm-cols"><div class="fmcol" id="fm-c0"></div><div class="fmcol" id="fm-c1"></div></div>
    <div id="fm-bottom"><div id="fm-timer"><div id="fm-tnum"></div></div><div id="fm-total"></div></div>
  </section>

  <section id="s-winner" class="screen center">
    <div class="rays"></div>
    <div class="sub ribbon">WINNER</div>
    <div id="w-name" class="ink"></div>
    <div id="w-score" class="ribbon"></div>
