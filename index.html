<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Control Panel</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.35 system-ui, Segoe UI, sans-serif; background: #15120f; color: #eee; }
#app { max-width: 1280px; margin: 0 auto; padding: 12px 16px 60px; }
h2 { margin: 0 0 8px; font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: #2AAAE2; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.card { background: #221d18; border: 1px solid #3a3229; border-radius: 10px; padding: 12px; margin-top: 12px; }
button { font: inherit; font-weight: 600; color: #eee; background: #3a3229; border: 1px solid #5a4d3d; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button:hover { background: #4a4035; }
button.on { background: #2AAAE2; border-color: #2AAAE2; color: #06222e; }
button.gold { background: #FFC216; border-color: #FFC216; color: #221a00; }
button.red { background: #c22a1f; border-color: #e0483c; }
button.big { font-size: 20px; padding: 14px 20px; }
button:disabled { opacity: .35; cursor: default; }
input, select { font: inherit; background: #120f0c; color: #eee; border: 1px solid #5a4d3d; border-radius: 6px; padding: 6px 8px; }
.grow { flex: 1; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.score { font-size: 44px; font-weight: 800; color: #FFC216; min-width: 90px; }
.status { font-size: 17px; font-weight: 600; padding: 10px 12px; border-radius: 8px; background: #0f2a36; border: 1px solid #2AAAE2; margin: 8px 0; }
.status.win { background: #3a2c00; border-color: #FFC216; }
.q { font-size: 20px; font-weight: 700; margin: 4px 0 8px; }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.ans { display: flex; gap: 10px; align-items: center; text-align: left; font-size: 17px; padding: 10px 12px; }
.ans b { width: 24px; color: #FFC216; }
.ans span { flex: 1; }
.ans.rev { background: #1d4a2a; border-color: #3fae5f; }
.pot { font-size: 30px; font-weight: 800; color: #FFC216; }
.fmrow { display: grid; grid-template-columns: 1fr 190px 86px 96px 44px; gap: 6px; align-items: center; margin-bottom: 6px; }
.fmq { font-size: 12px; color: #aaa; grid-column: 1 / -1; margin-top: 4px; }
.muted { color: #9a8f82; font-size: 13px; }
kbd { background: #000; border: 1px solid #555; border-radius: 4px; padding: 0 5px; font-size: 12px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="js/questions.js"></script>
<script src="js/engine.js"></script>
<script src="js/audio.js"></script>
<script src="js/control.js"></script>
</body>
</html>
