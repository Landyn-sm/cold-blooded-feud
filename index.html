<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Control Center</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font: 16px/1.35 system-ui, Segoe UI, sans-serif; background: #15120f; color: #eee; }
#app { max-width: 1200px; margin: 0 auto; padding: 0 16px 60px; }
h2 { margin: 0; font-size: 20px; color: #2AAAE2; }
h3 { margin: 14px 0 6px; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: #9a8f82; }
.actions h3 { margin-top: 0; color: #2AAAE2; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.card { background: #221d18; border: 1px solid #3a3229; border-radius: 12px; padding: 14px; margin-top: 12px; }
button { font: inherit; font-weight: 700; color: #eee; background: #3a3229; border: 2px solid #5a4d3d; border-radius: 10px; padding: 9px 14px; cursor: pointer; }
button:hover { filter: brightness(1.2); }
button.on { background: #2AAAE2; border-color: #2AAAE2; color: #06222e; }
button.gold { background: #FFC216; border-color: #FFC216; color: #221a00; }
button.red { background: #c22a1f; border-color: #e0483c; color: #fff; }
button.team0 { border-color: #FFC216; color: #FFC216; }
button.team1 { border-color: #F09C53; color: #F09C53; }
button.team0.on { background: #FFC216; color: #221a00; }
button.team1.on { background: #F09C53; color: #221a00; }
button.big { font-size: 19px; padding: 13px 18px; }
button.huge { font-size: 26px; padding: 20px 34px; }
button:disabled { opacity: .35; cursor: default; filter: none; }
input, select { font: inherit; background: #120f0c; color: #eee; border: 1px solid #5a4d3d; border-radius: 6px; padding: 7px 8px; }
.grow { flex: 1; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.top { position: sticky; top: 0; z-index: 5; display: flex; gap: 10px; align-items: center; padding: 12px 0; background: #15120f; border-bottom: 2px solid #3a3229; }
.now { flex: 1; font-size: 18px; font-weight: 600; padding: 10px 14px; border-radius: 10px; background: #0f2a36; border: 1px solid #2AAAE2; }
.next { font-size: 20px; padding: 16px 22px; background: #2fae55; border-color: #5fd883; color: #04210d; min-width: 240px; }
.next:disabled { background: #3a3229; border-color: #5a4d3d; color: #eee; }

.card.team0 { border-color: #FFC216; } .card.team1 { border-color: #F09C53; }
.card.live { box-shadow: 0 0 0 3px #fff; }
.tname { width: 230px; font-weight: 800; font-size: 20px; background: transparent; border-color: transparent; }
.tname:hover, .tname:focus { border-color: #5a4d3d; }
.score { font-size: 46px; font-weight: 900; color: #fff; line-height: 1; }
.q { font-size: 22px; font-weight: 700; margin: 8px 0 10px; }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ans { display: flex; gap: 12px; align-items: center; text-align: left; font-size: 20px; padding: 13px 14px; }
.ans b { width: 26px; color: #FFC216; }
.ans span { flex: 1; }
.ans.rev { background: #1d4a2a; border-color: #3fae5f; }
.pot { font-size: 30px; font-weight: 900; color: #FFC216; }
.actions { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-end; margin: 6px 0 4px; padding-top: 10px; border-top: 1px solid #3a3229; }
.strikes span { display: inline-block; font-size: 44px; font-weight: 900; color: #3a3229; margin-right: 12px; }
.strikes span.hit { color: #ff3b2f; }
.fmrow { display: grid; grid-template-columns: 1fr 200px 60px; gap: 6px; align-items: center; margin-bottom: 6px; }
.fmq { font-size: 13px; color: #aaa; grid-column: 1 / -1; margin-top: 4px; }
.dim { opacity: .45; }
.muted { color: #9a8f82; font-size: 13px; margin: 8px 0 0; }
summary { cursor: pointer; font-weight: 700; color: #9a8f82; }
kbd { background: #000; border: 1px solid #555; border-radius: 4px; padding: 0 5px; font-size: 12px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="js/questions.js"></script>
<script src="js/engine.js"></script>
<script src="js/audio.js"></script>
<script src="js/control.js"></script>
</body>
</html>
